# REST module tests — in-memory persistence via casehub-ledger-memory on classpath.
# H2 datasource satisfies Quarkus augmentation; in-memory @Alternative @Priority(1) implementations
# handle all actual reads/writes.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:ledgerresttestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/ledger/migration

casehub.ledger.hash-chain.enabled=true
