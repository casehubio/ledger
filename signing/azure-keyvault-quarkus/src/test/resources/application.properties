# Test configuration for Azure Key Vault signing

# Disable Hibernate ORM (tests don't need persistence)
quarkus.hibernate-orm.enabled=false

# Disable scheduled jobs (LedgerRetentionJob, TrustScoreJob, etc.)
quarkus.scheduler.enabled=false

# Enable the mock producer (Priority 2 beats the real AzureKeyVaultAgentSigner at Priority 1)
quarkus.arc.selected-alternatives=io.casehub.ledger.signing.azure.quarkus.MockAzureKeyVaultProducer

# Azure Key Vault configuration
casehub.ledger.azure-keyvault.key-mapping.configured-actor=https://test-vault.vault.azure.net#test-key
casehub.ledger.azure-keyvault.refresh-interval=24h
