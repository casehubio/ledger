# Test configuration for AWS KMS signing

# Disable Hibernate ORM (tests don't need persistence)
quarkus.hibernate-orm.enabled=false

# Disable scheduled jobs (LedgerRetentionJob, TrustScoreJob, etc.)
quarkus.scheduler.enabled=false

# Enable the mock producer (Priority 2 beats the real AwsKmsAgentSigner at Priority 1)
quarkus.arc.selected-alternatives=io.casehub.ledger.signing.aws.quarkus.MockAwsKmsClientProducer

# AWS KMS configuration
casehub.ledger.aws-kms.region=us-east-1
casehub.ledger.aws-kms.key-mapping.configured-actor=arn:aws:kms:us-east-1:123456789012:key/test-key-id
casehub.ledger.aws-kms.refresh-interval=5m
