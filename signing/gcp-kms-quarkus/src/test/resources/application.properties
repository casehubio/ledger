# Test configuration for GCP Cloud KMS signing

# Disable Hibernate ORM (tests don't need persistence)
quarkus.hibernate-orm.enabled=false

# Disable scheduled jobs (LedgerRetentionJob, TrustScoreJob, etc.)
quarkus.scheduler.enabled=false

# Enable the mock producer (Priority 2 beats the real GcpKmsAgentSigner at Priority 1)
quarkus.arc.selected-alternatives=io.casehub.ledger.signing.gcp.quarkus.MockGcpKmsClientProducer

# GCP Cloud KMS configuration
casehub.ledger.gcp-kms.key-mapping.configured-actor=projects/test-project/locations/us-central1/keyRings/test-ring/cryptoKeys/test-key/cryptoKeyVersions/1
casehub.ledger.gcp-kms.refresh-interval=5m
